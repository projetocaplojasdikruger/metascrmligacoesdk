async function salvarUsuario(uid){
  const perfil = $('usPerfil').value, vids = perfil==='admin' ? [] : [...document.querySelectorAll('.usVk:checked')].map(i => Number(i.value));
  const o = { nome:$('usNome').value.trim(), perfil, vendedora_id:vids[0]||null, ativo:$('usAtivo').value==='1' };
  if(!o.nome) return toast('Informe o nome.', 'err');
  if(perfil==='vendedora' && !vids.length) return toast('Vincule o acesso a pelo menos uma vendedora.', 'err');
  if(uid === db.me.id && (perfil!=='admin' || !o.ativo)) return toast('Você não pode remover seu próprio acesso de administrador.', 'err');
  $('usSalvar').disabled = true;
  try{
    if(!uid){
      const email = $('usEmail').value.trim().toLowerCase(), senha = $('usSenha').value;
      if(!email || senha.length < 8){ $('usSalvar').disabled = false; return toast('Informe e-mail e senha (mín. 8 caracteres).', 'err'); }
      const r = await authReq('signup', { email, password:senha, data:{ nome:o.nome } });
      uid = (r.user && r.user.id) || r.id;
      if(!uid) throw new Error('Não foi possível criar o usuário.');
      await new Promise(res => setTimeout(res, 600));
    }
    const rows = await sbFetch(`/rest/v1/usuarios?id=eq.${uid}`, { method:'PATCH', body:o, headers:{ Prefer:'return=representation' } });
    if(!rows || !rows.length) throw new Error('Usuário criado no Auth, mas o perfil não foi encontrado. Verifique se o 01_schema.sql (trigger) foi executado.');
    const k = db.usuarios.findIndex(x => x.id === uid); if(k>=0) db.usuarios[k] = rows[0]; else db.usuarios.push(rows[0]);
    await setVinculos(uid, vids);
    fecharModal(true); toast('Acesso salvo.', 'ok'); ir(st.page);
  }catch(e){ toast(e.message, 'err'); $('usSalvar').disabled = false; }
}

    <button class="btn" id="permOk" onclick="salvarPerm()">Salvar permissões</button></div>

      ${TELAS_PERM.map(k => `<td style="text-align:center"><input type="checkbox" class="plCk" ${adm ? 'checked disabled title="Administrador tem acesso total"' : `data-u="${u.id}" data-k="${k}" ${st.perm[u.id].has(k)?'checked':''} onchange="permMarcar('${u.id}','${k}',this.checked)"`}></td>`).join('')}
      <td class="act">${adm ? '' : `<button class="btn sec sm" onclick="permTodas('${u.id}',true)">Todas</button> <button class="btn sec sm" onclick="permTodas('${u.id}',false)">Nenhuma</button>`}</td></tr>`; }).join('') || '<tr><td colspan="10" class="empty">Nenhum usuário.</td></tr>'}
  </tbody></table></div>`;

function permMarcar(uid, k, on){ const s = st.perm[uid]; if(on) s.add(k); else s.delete(k); }
function permTodas(uid, on){
  st.perm[uid] = new Set(on ? TELAS_PERM : []);
  document.querySelectorAll(`input[data-u="${uid}"]`).forEach(i => i.checked = on);
}
async function salvarPerm(){
  const mud = [];
  for(const u of db.usuarios.filter(x => x.perfil !== 'admin')){
    const sel = st.perm[u.id]; if(!sel) continue;
    const novo = TELAS_OPER.every(k => sel.has(k)) && !sel.has('vendedoras') ? null : TELAS_PERM.filter(k => sel.has(k));
    if(JSON.stringify(novo) !== JSON.stringify(Array.isArray(u.telas) ? TELAS_PERM.filter(k => u.telas.includes(k)) : null)) mud.push({ u, novo });
  }
  const vazio = mud.find(m => m.novo && !m.novo.length && m.u.ativo);
  if(vazio && !confirm(`${vazio.u.email} ficará sem nenhuma tela liberada e não conseguirá usar o sistema. Continuar?`)) return;
  if(!mud.length) return toast('Nenhuma alteração para salvar.');
  $('permOk').disabled = true;
  try{
    for(const m of mud) await patchUsuario(m.u.id, { telas: m.novo });
    toast(`Permissões salvas (${mud.length} usuário(s)).`, 'ok'); pgPerm();
  }catch(e){ toast(/telas/i.test(e.message) ? 'Coluna de permissões não encontrada. Execute o 07_permissoes_telas.sql no Supabase.' : e.message, 'err'); $('permOk').disabled = false; }
}

const JSPDF_SRC = 'https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js';
const JSPDF_SRI = 'sha384-JcnsjUPPylna1s1fvi1u12X5qjY5OL56iySh75FdtrwhO/SWXgMjoVqcKyIIWOLk';
const AUTOT_SRC = 'https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js';
const AUTOT_SRI = 'sha384-fCAW/rDWORTbQXSiB7mOg0QtQ5c+r0f544y6XoKjuVva0nMBlCpNUjiFeG5iMdS3';
async function carregarPDF(){
  const msg = 'Não foi possível carregar o gerador de PDF. Verifique a internet e tente de novo.';
  if(!window.jspdf) await carregarScript(JSPDF_SRC, JSPDF_SRI, msg);
  if(!window.jspdf.jsPDF.API.autoTable) await carregarScript(AUTOT_SRC, AUTOT_SRI, msg);
}
function logoDataURL(){ const m = getComputedStyle(document.documentElement).getPropertyValue('--logo').match(/url\(["']?(data:[^"')]+)["']?\)/); return m ? m[1] : null; }
const pdfTxt = v => String(v ?? '').replace(/[^\u0000-ÿ]/g, '').replace(/\s+/g, ' ').trim();
async function gerarPDF({ titulo, subtitulo, resumo, colunas, linhas, arquivo, paisagem, estilos, kpis, graficos }){
  loading(true, 'Gerando PDF…');
  try{
    await carregarPDF();
    const doc = new window.jspdf.jsPDF({ orientation: paisagem ? 'landscape' : 'portrait', unit:'mm', format:'a4', compress:true });
    const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight(), logo = logoDataURL();
    const gerado = 'Gerado em ' + fmtDH(new Date().toISOString()) + ' por ' + pdfTxt(db.me.nome || db.me.email);
    const empresa = 'Empresa: ' + (curEmp() ? empNome(curEmp()) : 'Todas');
    const cab = () => {
      if(logo) try{ doc.addImage(logo, 'PNG', 12, 7, 27, 18, 'caplogo', 'FAST'); }catch(e){}
      doc.setTextColor(43,47,54); doc.setFont('helvetica','bold'); doc.setFontSize(15); doc.text(pdfTxt(titulo), 44, 14);
      doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(107,114,128);
      doc.text(pdfTxt([subtitulo, empresa].filter(Boolean).join('   |   ')), 44, 19.5); doc.text(pdfTxt(gerado), 44, 24);
      doc.setDrawColor(242,112,26); doc.setLineWidth(0.9); doc.line(12, 28, W-12, 28);
    };
    cab();
    let y = 33;
    if(kpis && kpis.length){
      const porLinha = paisagem ? 6 : 4, gap = 3, bw = (W - 24 - gap*(porLinha-1)) / porLinha, bh = 16;
      kpis.forEach((k, i) => { const col = i % porLinha, x = 12 + col*(bw+gap); if(i && col === 0) y += bh + gap;
        doc.setFillColor(250,250,251); doc.setDrawColor(229,231,235); doc.setLineWidth(0.2); doc.rect(x, y, bw, bh, 'FD');
        doc.setFillColor(242,112,26); doc.rect(x, y, 1.2, bh, 'F');
        doc.setFont('helvetica','normal'); doc.setFontSize(7); doc.setTextColor(107,114,128); doc.text(pdfTxt(k[0]), x+3.5, y+4.5);
        doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.setTextColor(31,35,40); doc.text(pdfTxt(k[1]), x+3.5, y+10.5);
        if(k[2]){ doc.setFont('helvetica','normal'); doc.setFontSize(6.5); doc.setTextColor(107,114,128); doc.text(pdfTxt(k[2]), x+3.5, y+14.2, { maxWidth: bw-5 }); } });
      y += bh + 6;
    }
    if(resumo){ doc.setFontSize(9.5); doc.setTextColor(43,47,54); doc.setFont('helvetica','bold'); doc.text(pdfTxt(resumo), 12, y); y += 4; }
    doc.autoTable({
      head: [colunas.map(pdfTxt)], body: linhas.map(r => r.map(pdfTxt)), startY: y, margin: { top: 33, left: 12, right: 12, bottom: 14 },
      styles: { font:'helvetica', fontSize: 8, cellPadding: 1.8, textColor:[31,35,40], lineColor:[229,231,235], lineWidth:0.1, overflow:'linebreak' },
      headStyles: { fillColor:[242,112,26], textColor:255, fontStyle:'bold' },
      alternateRowStyles: { fillColor:[253,245,238] }, columnStyles: estilos || {},
      didDrawPage: d => { if(d.pageNumber > 1) cab(); }
    });
    if(graficos && graficos.length){
      let gy = doc.lastAutoTable.finalY + 8, col = 0, alturaLinha = 0;
      const gap = 6, gw = (W - 24 - gap) / 2;
      for(const g of graficos){
        const cv = $(g.canvas); if(!cv || !cv.width) continue;
        const gh = gw * cv.height / cv.width;
        if(col === 0 && gy + gh + 6 > H - 14){ doc.addPage(); cab(); gy = 34; }
        const x = 12 + col * (gw + gap);
        doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(43,47,54); doc.text(pdfTxt(g.titulo), x, gy);
        try{ doc.addImage(cv.toDataURL('image/png'), 'PNG', x, gy + 2, gw, gh); }catch(e){}
        alturaLinha = Math.max(alturaLinha, gh + 8);
        if(col === 1){ gy += alturaLinha; col = 0; alturaLinha = 0; } else col = 1;
      }
    }
    const n = doc.internal.getNumberOfPages();
    for(let i = 1; i <= n; i++){ doc.setPage(i); doc.setFontSize(8); doc.setTextColor(107,114,128); doc.setDrawColor(58,63,71); doc.setLineWidth(0.3); doc.line(12, H-10, W-12, H-10);
      doc.text('C@P Consultoria  -  Acompanhamento de Ligações', 12, H-6); doc.text('Página ' + i + ' de ' + n, W-12, H-6, { align:'right' }); }
    doc.save(arquivo);
    toast('PDF gerado.', 'ok');
  }catch(e){ toast(e.message, 'err'); }
  finally{ loading(false); }
}

  CT.url = null; CT.blob = null;
  if($('ctAudBox')){ $('ctAud').removeAttribute('src'); $('ctAudBox').classList.add('hidden'); }
  if($('ctRec') && !(CT.rec && CT.rec.state === 'recording')){ $('ctRec').textContent = '🎤 Gravar áudio'; $('ctRecSt').textContent = 'Toque para gravar e toque de novo para parar.'; }
}
function ctLimpar(){
  clearInterval(CT.iv);
  if(CT.rec){ CT.rec.onstop = null; try{ if(CT.rec.state !== 'inactive') CT.rec.stop(); }catch(e){} CT.rec = null; }
  if(CT.stream){ CT.stream.getTracks().forEach(t => t.stop()); CT.stream = null; }
  ctDescartar();
}
async function ctGravar(){
  if(CT.rec && CT.rec.state === 'recording'){ CT.rec.stop(); return; }
  const mime = ctMime();
  if(mime === null) return toast('Este navegador não permite gravar áudio.', 'err');
  try{ CT.stream = await navigator.mediaDevices.getUserMedia({ audio:true }); }
  catch(e){ return toast('Microfone bloqueado. Libere o acesso ao microfone no navegador para gravar.', 'err'); }
  ctDescartar(); CT.chunks = [];
  CT.rec = new MediaRecorder(CT.stream, mime ? { mimeType:mime } : undefined);
  CT.rec.ondataavailable = e => { if(e.data && e.data.size) CT.chunks.push(e.data); };
  CT.rec.onstop = () => {
    clearInterval(CT.iv);
    if(CT.stream){ CT.stream.getTracks().forEach(t => t.stop()); CT.stream = null; }
    CT.mime = ((CT.rec && CT.rec.mimeType) || mime || 'audio/webm').split(';')[0];
    CT.blob = new Blob(CT.chunks, { type:CT.mime }); CT.rec = null;
    if(!$('ctRec')) return;
    CT.url = URL.createObjectURL(CT.blob); $('ctAud').src = CT.url; $('ctAudBox').classList.remove('hidden');
    $('ctRec').classList.remove('rec-on'); $('ctRec').textContent = '🎤 Gravar de novo';
    $('ctRecSt').textContent = 'Áudio de ' + fmtDur((Date.now()-CT.t0)/1000) + ' pronto. Ouça antes de enviar.';
  };
  CT.rec.start(); CT.t0 = Date.now();
  $('ctRec').classList.add('rec-on'); $('ctRec').textContent = '■ Parar';
  CT.iv = setInterval(() => { if($('ctRecSt')) $('ctRecSt').textContent = 'Gravando… ' + fmtDur((Date.now()-CT.t0)/1000); }, 500);
}
/* Celular: abre o compartilhar com o áudio (escolher WhatsApp e a cliente).
   Computador: baixa o áudio e abre a conversa da cliente — é só anexar o arquivo (📎). */
function ctEnviarAudio(cid){
  const c = M.cli[cid];
  if(!CT.blob) return toast('Grave o áudio primeiro.', 'err');
  const ext = { 'audio/mp4':'m4a', 'audio/ogg':'ogg' }[CT.mime] || 'webm';
  const nome = `audio-${primeiroNome(c.nome).toLowerCase() || 'cliente'}.${ext}`;
  const file = new File([CT.blob], nome, { type:CT.mime });
  if(window.matchMedia('(pointer:coarse)').matches && navigator.canShare && navigator.canShare({ files:[file] })){
    navigator.share({ files:[file] }).catch(e => { if(e.name !== 'AbortError') toast('Não foi possível compartilhar: ' + e.message, 'err'); });
    return;
  }
  const a = document.createElement('a'); a.href = CT.url; a.download = nome; document.body.appendChild(a); a.click(); a.remove();
  const f = foneWa(c); if(f) window.open(`https://wa.me/55${f}`, '_blank', 'noopener');
  toast('Áudio salvo no computador. Na conversa do WhatsApp, anexe o arquivo baixado (📎).', 'ok');
}
function abrirContato(cid, vid, aniv){
  const c = M.cli[cid]; if(!c) return;
  vid = vid || vendPadraoCli(c);
  abrirModal('💬 Mensagem e áudio · ' + esc(c.nome), `<div class="form"><div class="full"><label>Vendedora que envia</label><select id="ctVend" onchange="ctAtualizarTxt(${cid})">${vendOptions(vid,'Selecione…',c.empresa_id)}</select></div></div>
    <div class="small muted" style="margin-top:8px">WhatsApp: ${foneWa(c) ? esc([c.celular, c.telefone].filter(Boolean).join(' · ')) : '<span style="color:var(--bad)">sem telefone</span>'} · Loja: ${esc(empNome(c.empresa_id))}</div>
    <div id="ctBox"></div>`, `<button class="btn sec" onclick="fecharModal()">Fechar</button>`);
  $('ctBox').innerHTML = ctPainelHTML(c, aniv);
}
function ctToggleLig(){ const b = $('ctBox'); if(!b) return; b.classList.toggle('hidden'); if(!b.classList.contains('hidden')) b.scrollIntoView({ behavior:'smooth', block:'nearest' }); }

/* ============================ CLIENTES TRAZIDOS (ranking) ============================ */
const META_TRAZIDOS = 5;
const CANAIS = ['Ligação','Mensagem','Áudio'];
const CANAL_IC = { 'Ligação':'📞', 'Mensagem':'💬', 'Áudio':'🎤' };
const fmtMoeda = v => Number(v||0).toLocaleString('pt-BR', { style:'currency', currency:'BRL' });
function trazVisiveis(){ return db.conversoes.filter(x => empOk(x.empresa_id) && (isAdmin() || minhas().includes(x.vendedora_id))); }
function pgTraz(){
  const p = st.traz, comp = p.comp, anoAt = new Date().getFullYear();
  if(db.convErr){ $('content').innerHTML = `<div class="card blocked"><div style="font-size:40px">🛠️</div><p>A tabela de clientes conquistados ainda não existe no Supabase. Execute o arquivo <b>09_clientes_trazidos.sql</b> no SQL Editor e clique em ↻.</p><p class="small muted">${esc(db.convErr)}</p></div>`; return; }
  const l = trazVisiveis().filter(x => x.data_compra.slice(0,7) === comp && (!p.vend || String(x.vendedora_id) === String(p.vend)))
    .sort((a,b) => b.data_compra.localeCompare(a.data_compra) || b.id - a.id);
  let vends = vendsVisiveis(); if(p.vend) vends = vends.filter(v => String(v.id) === String(p.vend));
  const rk = vends.map(v => { const r = l.filter(x => x.vendedora_id === v.id);
      return { v, n: new Set(r.map(x => x.cliente_id)).size, compras: r.length, valor: r.reduce((s,x) => s + Number(x.valor||0), 0), canais: CANAIS.map(k => r.filter(x => x.canal === k).length) }; })
    .filter(x => x.v.ativa || x.compras).sort((a,b) => b.n - a.n || b.valor - a.valor || a.v.nome.localeCompare(b.v.nome));
  const totCli = rk.reduce((s,x) => s + x.n, 0), totVal = l.reduce((s,x) => s + Number(x.valor||0), 0), bateram = rk.filter(x => x.n >= META_TRAZIDOS).length;
  const anos = []; for(let y = anoAt-2; y <= anoAt+1; y++) anos.push(y);
  const medalha = k => ['🥇','🥈','🥉'][k] || (k+1);
  $('content').innerHTML = `
  <div class="filters">
    <div class="f"><label>Mês</label><select onchange="st.traz.comp=st.traz.comp.slice(0,4)+'-'+this.value;pgTraz()">${MESES.map((m,i)=>`<option value="${pad(i+1)}" ${comp.slice(5)===pad(i+1)?'selected':''}>${m}</option>`).join('')}</select></div>
    <div class="f"><label>Ano</label><select onchange="st.traz.comp=this.value+'-'+st.traz.comp.slice(5);pgTraz()">${anos.map(y=>`<option ${Number(comp.slice(0,4))===y?'selected':''}>${y}</option>`).join('')}</select></div>
    ${verVendFiltro()?`<div class="f"><label>Vendedora</label><select onchange="st.traz.vend=this.value;pgTraz()">${vendOptions(p.vend,'Todas')}</select></div>`:''}
    <div class="f grow small muted" style="padding-bottom:9px">Meta: trazer ${META_TRAZIDOS} clientes por mês para a loja, por ligação, mensagem ou áudio.</div>
    <button class="btn" onclick="abrirTraz()">+ Registrar cliente conquistado</button>
  </div>
  <div class="kpis">
    <div class="kpi"><div class="l">Clientes conquistados</div><div class="v">${fmtN(totCli)}</div><div class="s">${fmtN(l.length)} compra(s) registrada(s)</div></div>
    <div class="kpi ok"><div class="l">Valor vendido</div><div class="v">${fmtMoeda(totVal)}</div><div class="s">Ticket médio ${fmtMoeda(l.length ? totVal/l.length : 0)}</div></div>
    <div class="kpi info"><div class="l">Bateram a meta (${META_TRAZIDOS})</div><div class="v">${bateram} de ${rk.length}</div><div class="s">vendedora(s)</div></div>
    <div class="kpi dk"><div class="l">Por canal</div><div class="v" style="font-size:16px">${CANAIS.map(k => CANAL_IC[k]+' '+l.filter(x=>x.canal===k).length).join(' &nbsp; ')}</div><div class="s">Ligação · Mensagem · Áudio</div></div>
  </div>
  <div class="card" style="margin-bottom:14px"><h3>🏆 Ranking — ${MESES[Number(comp.slice(5))-1]}/${comp.slice(0,4)}</h3>
  <div class="tbl-wrap" style="border:0"><table><thead><tr><th>#</th><th>Vendedora</th><th>Empresa</th><th class="num">Clientes conquistados</th><th>Meta (${META_TRAZIDOS})</th><th class="num">📞 / 💬 / 🎤</th><th class="num">Valor vendido</th><th>Situação</th></tr></thead><tbody>
  ${rk.map((x,k) => { const pp = Math.round(x.n / META_TRAZIDOS * 100);
    return `<tr><td>${medalha(k)}</td><td><b>${esc(x.v.nome)}</b></td><td>${empTag(x.v.empresa_id)}</td><td class="num"><b>${x.n}</b></td>
      <td><div style="display:flex;gap:8px;align-items:center"><div class="prog ${pp>=100?'ok':''}" style="flex:1"><div style="width:${Math.min(pp,100)}%"></div></div><b>${x.n}/${META_TRAZIDOS}</b></div></td>
      <td class="num">${x.canais.join(' / ')}</td><td class="num">${fmtMoeda(x.valor)}</td>
      <td>${x.n >= META_TRAZIDOS ? '<span class="tag ok">Meta batida</span>' : x.n ? `<span class="tag warn">Faltam ${META_TRAZIDOS - x.n}</span>` : '<span class="tag">Nenhum ainda</span>'}</td></tr>`; }).join('') || '<tr><td colspan="8" class="empty">Nenhuma vendedora.</td></tr>'}
  </tbody></table></div></div>
  <div class="card"><h3>Compras registradas</h3>
  <div class="tbl-wrap" style="border:0"><table><thead><tr><th>Data da compra</th><th>Cliente</th><th>Vendedora</th><th>Canal</th><th>Nota fiscal</th><th class="num">Valor</th><th></th></tr></thead><tbody>
  ${l.map(x => `<tr><td>${fmtD(x.data_compra)}</td><td><b>${esc(cliNome(x.cliente_id))}</b></td><td>${esc(vendNome(x.vendedora_id))}${curEmp()?'':' '+empTag(x.empresa_id)}</td>
    <td><span class="tag or">${CANAL_IC[x.canal]||''} ${esc(x.canal)}</span></td><td>${esc(x.nota_fiscal)}</td><td class="num">${fmtMoeda(x.valor)}</td>
    <td class="act"><button class="btn sec sm" title="Editar" onclick="abrirTraz(${x.id})">✎</button> <button class="btn danger sm" title="Excluir" onclick="excluirTraz(${x.id})">🗑</button></td></tr>`).join('') || '<tr><td colspan="7" class="empty">Nenhuma compra registrada neste mês.</td></tr>'}
  </tbody></table></div></div>`;
}
function abrirTraz(id){
  const x = id ? db.conversoes.find(r => r.id === id) : null, mv = minhas();
  const vend = x ? x.vendedora_id : (st.traz.vend || (!isAdmin() && mv.length === 1 ? mv[0] : ''));
  abrirModal(x ? 'Editar cliente conquistado' : '🏆 Registrar cliente conquistado', `<div class="form">
    <div><label>Vendedora que trouxe *</label><select id="tzVend">${vendOptions(vend,'Selecione…')}</select></div>
    <div><label>Como trouxe *</label><select id="tzCanal">${CANAIS.map(k=>`<option ${(x?x.canal:'Ligação')===k?'selected':''}>${k}</option>`).join('')}</select></div>
    <div class="full"><label>Cliente *</label>${clientePickerHTML(x ? x.cliente_id : '')}</div>
    <div><label>Dia da compra *</label><input type="date" id="tzData" value="${x ? x.data_compra : hoje()}"></div>
    <div><label>Nº da nota fiscal *</label><input id="tzNF" value="${esc(x ? x.nota_fiscal : '')}" inputmode="numeric"></div>
    <div><label>Valor (R$) *</label><input type="number" id="tzValor" min="0" step="0.01" inputmode="decimal" value="${x ? x.valor : ''}" placeholder="0,00"></div></div>`,
    `<button class="btn sec" onclick="fecharModal()">Cancelar</button><button class="btn" id="tzSalvar" onclick="salvarTraz(${x?x.id:'null'})">Salvar</button>`);
}
async function salvarTraz(id){
  const vend = Number($('tzVend').value), cid = Number($('pkId').value), data = $('tzData').value, nf = $('tzNF').value.trim(), valor = Number(String($('tzValor').value).replace(',','.'));
  if(!vend) return toast('Selecione a vendedora.', 'err');
  if(!cid) return toast('Selecione o cliente.', 'err');
  if(!data) return toast('Informe o dia da compra.', 'err');
  if(!nf) return toast('Informe o número da nota fiscal.', 'err');
  if(!(valor > 0)) return toast('Informe o valor da compra.', 'err');
  const emp = M.vend[vend].empresa_id;
  if(M.cli[cid].empresa_id !== emp) return toast(`Este cliente é da ${empNome(M.cli[cid].empresa_id)} e a vendedora é da ${empNome(emp)}.`, 'err');
  const dup = db.conversoes.find(r => r.empresa_id === emp && r.nota_fiscal === nf && r.id !== id);
  if(dup) return toast(`A nota fiscal ${nf} já foi registrada (${cliNome(dup.cliente_id)}, ${vendNome(dup.vendedora_id)}).`, 'err');
  const o = { empresa_id:emp, vendedora_id:vend, cliente_id:cid, canal:$('tzCanal').value, data_compra:data, nota_fiscal:nf, valor };
  $('tzSalvar').disabled = true;
  try{
    if(id) Object.assign(db.conversoes.find(r => r.id === id), await api.upd('clientes_trazidos', id, o));
    else db.conversoes.push(await api.ins('clientes_trazidos', o));
    fecharModal(true); toast('Cliente conquistado registrado.', 'ok');
    st.traz.comp = data.slice(0,7); if(st.page === 'trazidos') pgTraz();
  }catch(e){ toast(/duplicate|unique/i.test(e.message) ? 'Essa nota fiscal já foi registrada nesta loja.' : e.message, 'err'); $('tzSalvar').disabled = false; }
}
async function excluirTraz(id){
  const x = db.conversoes.find(r => r.id === id); if(!x) return;
  if(!confirm(`Excluir a compra da NF ${x.nota_fiscal} (${cliNome(x.cliente_id)})?`)) return;
  try{ await api.del('clientes_trazidos', id); db.conversoes = db.conversoes.filter(r => r.id !== id); toast('Registro excluído.', 'ok'); pgTraz(); }
  catch(e){ toast(e.message, 'err'); }
}

  let tema = 'light'; try{ tema = localStorage.getItem(TEMA_KEY) || 'light'; }catch(e){}
  aplicarTema(tema);
  if(!/^https:\/\/[a-z0-9]+\.supabase\.co$/.test(CONFIG.SUPABASE_URL)){ mostrarLogin('Configure SUPABASE_URL e SUPABASE_ANON_KEY no início do script do index.html.'); return; }
  loadSess();
  if(S && S.access_token) boot(); else mostrarLogin();
})();
